### Keys

## Terminal special combos
C_M_lbracket="\u00a0"
C_M_rbracket="\u00a1"
C_M_S_lbracket="\u00a2"
C_M_S_rbracket="\u00a3"

C_M_S_h="\u00a4"
C_M_S_j="\u00a5"
C_M_S_k="\u00a6"
C_M_S_l="\u00a7"

C_M_apostrophe="\u00a8"
C_M_semicolon="\u00a9"
C_M_S_dblquote="\u00b0"
C_M_S_colon="\u00b1"

C_M_return="\u00b2"

C_M_key1="\u00c1"
C_M_key2="\u00c2"
C_M_key3="\u00c3"
C_M_key4="\u00c4"
C_M_key5="\u00c5"
C_M_key6="\u00c6"
C_M_key7="\u00c7"
C_M_key8="\u00c8"
C_M_key9="\u00c9"

C_S_h="\u00d0"
C_S_j="\u00d1"
C_S_k="\u00d2"
C_S_l="\u00d3"

C_slash="\u00d4"

## Bindings
unbind-key C-b
unbind-key [
unbind-key Escape
unbind-key C-[
unbind-key Space
unbind-key d

bind-key C-Space send-prefix

bind-key s switch-client -Tt_s
bind-key v switch-client -Tt_v
bind-key C-Space switch-client -Tt_❤

bind-key -Tt_s e switch-client -Troot \; choose-tree
bind-key -Tt_❤ f switch-client -Troot \; resize-pane -Z

bind-key ` copy-mode

bind-key -r M-] next-layout
bind-key -r M-[ next-layout

bind-key -nr "$C_M_S_h" swap-pane -s '{left-of}'
bind-key -nr "$C_M_S_j" swap-pane -s '{down-of}'
bind-key -nr "$C_M_S_k" swap-pane -s '{up-of}'
bind-key -nr "$C_M_S_l" swap-pane -s '{right-of}'

# Conditions use formats (if-shell -F) instead of [[ ]] so they work with any default-shell (bash, fish, ...)
bind-key -nr "$C_S_h"  if-shell -F "#{pane_at_left}" {
  if-shell -F "#{m/r:0,#{pane_at_top}#{pane_at_bottom}}" {
    split-window -fhb
    swap-pane -t !
    kill-pane -t !
  }
} {
  if-shell -F "#{pane_at_bottom}" {
    join-pane -t '{left-of}'
  } {
    join-pane -bt '{left-of}'
  }
}

bind-key -nr "$C_S_j"  if-shell -F "#{pane_at_bottom}" {
  if-shell -F "#{m/r:01|10,#{pane_at_top}#{pane_at_bottom}}" {
    if-shell -F "#{pane_at_left}" {
      join-pane -bt '{right-of}'
    } {
      join-pane -t '{right-of}'
    }
  }
} {
  if-shell -F "#{pane_at_left}" {
    join-pane -bht '{down-of}'
  } {
    join-pane -ht '{down-of}'
  }
}

bind-key -nr "$C_S_k" if-shell -F "#{pane_at_top}" {
  if-shell -F "#{m/r:01|10,#{pane_at_top}#{pane_at_bottom}}" {
    if-shell -F "#{pane_at_left}" {
      join-pane -bt '{right-of}'
    } {
      join-pane -t '{right-of}'
    }
  }
} {
  if-shell -F "#{pane_at_left}" {
    join-pane -bht '{up-of}'
  } {
    join-pane -ht '{up-of}'
  }
}

bind-key -nr "$C_S_l" if-shell -F "#{pane_at_right}" {
  if-shell -F "#{m/r:0,#{pane_at_top}#{pane_at_bottom}}" {
    split-window -fh
    swap-pane -t !
    kill-pane -t !
  }
} {
  if-shell -F "#{pane_at_bottom}" {
    join-pane -t '{right-of}'
  } {
    join-pane -bt '{right-of}'
  }
}

bind-key -n M-h if-shell -F "#{@navi-state}" "send-keys M-h" "select-pane -LZ"
bind-key -n M-j if-shell -F "#{@navi-state}" "send-keys M-j" "select-pane -DZ"
bind-key -n M-k if-shell -F "#{@navi-state}" "send-keys M-k" "select-pane -UZ"
bind-key -n M-l if-shell -F "#{@navi-state}" "send-keys M-l" "select-pane -RZ"

bind-key -n M-H select-pane -LZ
bind-key -n M-J select-pane -DZ
bind-key -n M-K select-pane -UZ
bind-key -n M-L select-pane -RZ

bind-key -r j select-pane -DZ
bind-key -r h select-pane -LZ
bind-key -r k select-pane -UZ
bind-key -r l select-pane -RZ

bind-key -n "$C_M_lbracket" resize-pane -L 4
bind-key -n "$C_M_rbracket" resize-pane -R 4
bind-key -n "$C_M_S_lbracket" resize-pane -U 4
bind-key -n "$C_M_S_rbracket" resize-pane -D 4

bind-key a last-window
bind-key C-a last-window
bind-key -r "M-'" next-window
bind-key -r "M-;" previous-window

bind-key -n C-M-a last-window
bind-key -n "$C_M_semicolon" previous-window
bind-key -n "$C_M_apostrophe" next-window
bind-key -n "$C_M_semicolon" previous-window
bind-key -n "$C_M_S_dblquote" swap-window -dt +1
bind-key -n "$C_M_S_colon" swap-window -dt -1
bind-key -n M-A last-pane

bind-key V split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"

bind-key C-v split-window -hl 20% -c "#{pane_current_path}"
bind-key C-s split-window -vl 20% -c "#{pane_current_path}"

bind-key -Tt_v v switch-client -Troot \; split-window -h -c "#{pane_current_path}"
bind-key -Tt_s s switch-client -Troot \; split-window -v -c "#{pane_current_path}"

bind-key -n "$C_M_return" new-window -c "#{pane_current_path}"

bind-key "1" if-shell -F '#{m/r:(^| )1( |$),#{W:#{window_index} }}' "select-window -t :1" "new-window -t :1 -c '#{pane_current_path}'"
bind-key "2" if-shell -F '#{m/r:(^| )2( |$),#{W:#{window_index} }}' "select-window -t :2" "new-window -t :2 -c '#{pane_current_path}'"
bind-key "3" if-shell -F '#{m/r:(^| )3( |$),#{W:#{window_index} }}' "select-window -t :3" "new-window -t :3 -c '#{pane_current_path}'"
bind-key "4" if-shell -F '#{m/r:(^| )4( |$),#{W:#{window_index} }}' "select-window -t :4" "new-window -t :4 -c '#{pane_current_path}'"
bind-key "5" if-shell -F '#{m/r:(^| )5( |$),#{W:#{window_index} }}' "select-window -t :5" "new-window -t :5 -c '#{pane_current_path}'"
bind-key "6" if-shell -F '#{m/r:(^| )6( |$),#{W:#{window_index} }}' "select-window -t :6" "new-window -t :6 -c '#{pane_current_path}'"
bind-key "7" if-shell -F '#{m/r:(^| )7( |$),#{W:#{window_index} }}' "select-window -t :7" "new-window -t :7 -c '#{pane_current_path}'"
bind-key "8" if-shell -F '#{m/r:(^| )8( |$),#{W:#{window_index} }}' "select-window -t :8" "new-window -t :8 -c '#{pane_current_path}'"
bind-key "9" if-shell -F '#{m/r:(^| )9( |$),#{W:#{window_index} }}' "select-window -t :9" "new-window -t :9 -c '#{pane_current_path}'"

bind-key -n "$C_M_key1" if-shell -F '#{m/r:(^| )1( |$),#{W:#{window_index} }}' "select-window -t :1" "new-window -t :1 -c '#{pane_current_path}'"
bind-key -n "$C_M_key2" if-shell -F '#{m/r:(^| )2( |$),#{W:#{window_index} }}' "select-window -t :2" "new-window -t :2 -c '#{pane_current_path}'"
bind-key -n "$C_M_key3" if-shell -F '#{m/r:(^| )3( |$),#{W:#{window_index} }}' "select-window -t :3" "new-window -t :3 -c '#{pane_current_path}'"
bind-key -n "$C_M_key4" if-shell -F '#{m/r:(^| )4( |$),#{W:#{window_index} }}' "select-window -t :4" "new-window -t :4 -c '#{pane_current_path}'"
bind-key -n "$C_M_key5" if-shell -F '#{m/r:(^| )5( |$),#{W:#{window_index} }}' "select-window -t :5" "new-window -t :5 -c '#{pane_current_path}'"
bind-key -n "$C_M_key6" if-shell -F '#{m/r:(^| )6( |$),#{W:#{window_index} }}' "select-window -t :6" "new-window -t :6 -c '#{pane_current_path}'"
bind-key -n "$C_M_key7" if-shell -F '#{m/r:(^| )7( |$),#{W:#{window_index} }}' "select-window -t :7" "new-window -t :7 -c '#{pane_current_path}'"
bind-key -n "$C_M_key8" if-shell -F '#{m/r:(^| )8( |$),#{W:#{window_index} }}' "select-window -t :8" "new-window -t :8 -c '#{pane_current_path}'"
bind-key -n "$C_M_key9" if-shell -F '#{m/r:(^| )9( |$),#{W:#{window_index} }}' "select-window -t :9" "new-window -t :9 -c '#{pane_current_path}'"

bind-key   @ choose-window 'join-pane -h -s "%%"'
bind-key C-@ choose-window 'join-pane    -s "%%"'

bind-key -n M-~ choose-window 'join-pane -h -s "%%"'
bind-key -n M-! if-shell -F '#{m/r:(^| )1( |$),#{W:#{window_index} }}' 'join-pane -ht :1' 'break-pane -t :1'
bind-key -n M-@ if-shell -F '#{m/r:(^| )2( |$),#{W:#{window_index} }}' 'join-pane -ht :2' 'break-pane -t :2'
bind-key -n M-# if-shell -F '#{m/r:(^| )3( |$),#{W:#{window_index} }}' 'join-pane -ht :3' 'break-pane -t :3'
bind-key -n M-$ if-shell -F '#{m/r:(^| )4( |$),#{W:#{window_index} }}' 'join-pane -ht :4' 'break-pane -t :4'
bind-key -n M-% if-shell -F '#{m/r:(^| )5( |$),#{W:#{window_index} }}' 'join-pane -ht :5' 'break-pane -t :5'
bind-key -n M-^ if-shell -F '#{m/r:(^| )6( |$),#{W:#{window_index} }}' 'join-pane -ht :6' 'break-pane -t :6'
bind-key -n M-& if-shell -F '#{m/r:(^| )7( |$),#{W:#{window_index} }}' 'join-pane -ht :7' 'break-pane -t :7'
bind-key -n M-* if-shell -F '#{m/r:(^| )8( |$),#{W:#{window_index} }}' 'join-pane -ht :8' 'break-pane -t :8'
bind-key -n M-( if-shell -F '#{m/r:(^| )9( |$),#{W:#{window_index} }}' 'join-pane -ht :9' 'break-pane -t :9'

bind-key x set-option -gF @tmux-cut-pane "#{pane_id}" \; display-message "Cut pane [#{@tmux-cut-pane}] #{pane_title}"
bind-key p run-shell -C "move-pane -s #{@tmux-cut-pane}" \; display-message "Paste pane [#{@tmux-cut-pane}] #{pane_title}"

bind-key X set-option -gF @tmux-cut-window "#{window_id}" \; display-message "Cut window [#{@tmux-cut-window}] #{window_name}"
bind-key P run-shell -C "move-window -s =#{@tmux-cut-window}" \; display-message "Paste window [#{@tmux-cut-window}] #{window_name}"

bind-key C-f resize-pane -Z

bind-key r command-prompt "rename-window '%%'"

bind-key Q confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key C-w confirm-before -p "kill-window #W? (y/n)" kill-window

bind-key R source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

