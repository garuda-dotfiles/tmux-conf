### Look & Feel
# Window names equal to the shell (zsh, bash, fish) are hidden
set-option -g pane-border-lines single

set-option -g pane-active-border-style "fg=color213"
set-option -g message-style 'bg=magenta,fg=white,bold'

set-option -g set-titles-string            '#{window_index}#{?#{m/r:^(zsh|bash|fish)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],}#{?#{>:#{session_windows},1},(#{window_index}/#{session_windows}),}'
set-option -g window-status-style          'fg=#9887c3,bold'
set-option -g window-status-last-style     'fg=#ded8eb,bold'
set-option -g window-status-format         ' #{window_index}#{?#{m/r:^(zsh|bash|fish)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],} '
set-option -g window-status-current-format ' #{window_index}#{?#{m/r:^(zsh|bash|fish)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],} '
set-option -g window-status-current-style  'bg=magenta,fg=white,bold'

set-option -g status-left-length 140
set-option -g status-right-length 140
set-option -g status-justify absolute-centre
set-option -g status-style 'bg=default'
set-option -g status-left '#{prefix_highlight}#(cat #{socket_path}-\#{session_id}-vimbridge)'
set-option -g status-right '#(cat #{socket_path}-\#{session_id}-vimbridge-R)'

### Plugins
