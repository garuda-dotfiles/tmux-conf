# psmux.conf: Windows (psmux) port of tmux.conf
# Linux keeps using tmux.conf. Differences from tmux.conf:
#   - psmux has no `VAR=value` config variables: the special-combo characters
#     sent by WezTerm are written literally in each bind-key (code point noted).
#   - psmux has no multi-line `{ }` blocks: nested logic uses one-line `if-shell -F`.
#   - if-shell/run-shell run PowerShell, not bash: shell tests ([[ ]], readlink /proc,
#     `tmux has-session`) are replaced by format conditions.
#   - psmux treats M-H and M-h as the same key, so the M-H/J/K/L bindings are dropped.
#   - navi.tmux (bash + ps) is replaced by matching #{pane_current_command}.
#   - tpm plugins are replaced: prefix-highlight is rebuilt with formats below;
#     tmux-thumbs, tmux-autoreload, tmuxifier popups and the vimbridge status are Linux-only.

# Repo location, used by bindings that call scripts/ (forward slashes)
%hidden PSMUX_CONF_DIR="D:/namph2003/configurations/tmux-conf"

set-option -g default-terminal "tmux-256color"
set-option -s default-terminal "tmux-256color"
set-option -g terminal-overrides "wezterm:RGB" # Enable truecolor support in WezTerm
set-option -g escape-time 0
set-option -g repeat-time 1000
set-option -g history-limit 50000
set-option -g display-time 4000
set-option -g status-interval 1
set-option -g aggressive-resize on
set-option -g window-size latest
set-option -g renumber-windows on
set-option -g mouse on
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g status-keys emacs
set-option -g focus-events on
set-option -g mode-keys vi
# ConPTY turns Ctrl+Space (NUL) into a plain space, so WezTerm sends Õ (U+00D5)
# for Ctrl+Space instead; C-Space stays as prefix2 for terminals that pass it through.
set-option -g prefix "Õ"
set-option -g prefix2 C-Space
set-option -g set-titles on

### Keys

## Terminal special combos (sent by WezTerm as single characters, see ~/.wezterm.lua)
# C-M-[ U+00A0   C-M-] ¡ U+00A1   C-M-S-[ ¢ U+00A2   C-M-S-] £ U+00A3
# C-M-S-h ¤ U+00A4   C-M-S-j ¥ U+00A5   C-M-S-k ¦ U+00A6   C-M-S-l § U+00A7
# C-M-' ¨ U+00A8   C-M-; © U+00A9   C-M-S-" ° U+00B0   C-M-S-: ± U+00B1
# C-M-Return ² U+00B2
# C-M-1..9 Á Â Ã Ä Å Æ Ç È É (U+00C1..U+00C9)
# C-S-h Ð U+00D0   C-S-j Ñ U+00D1   C-S-k Ò U+00D2   C-S-l Ó U+00D3
# C-/ Ô U+00D4
# C-Space Õ U+00D5 (prefix)

## Bindings
unbind-key C-b
unbind-key [
unbind-key Escape
unbind-key C-[
unbind-key Space
unbind-key d

bind-key "Õ" send-prefix

bind-key s switch-client -T t_s
bind-key v switch-client -T t_v
bind-key "Õ" switch-client -T t_❤
bind-key C-Space switch-client -T t_❤

bind-key -T t_s e switch-client -T root \; choose-tree
bind-key -T t_❤ f switch-client -T root \; resize-pane -Z

bind-key ` copy-mode

bind-key -r M-] next-layout
bind-key -r M-[ next-layout

# C-M-S-h/j/k/l: swap pane with neighbour (psmux has no {left-of} targets;
# -L/-R are spatial, -U/-D swap with the previous/next pane as in tmux)
bind-key -nr "¤" swap-pane -L
bind-key -nr "¥" swap-pane -D
bind-key -nr "¦" swap-pane -U
bind-key -nr "§" swap-pane -R

# C-S-h/j/k/l: move pane into the neighbouring column/row.
# psmux cannot join-pane within one window, so scripts/move-pane.ps1 does it
# via break-pane + join-pane. The full-height split at the outer edge
# (split-window -f) has no psmux equivalent and only shows a message.
bind-key -nr "Ð" run-shell -b "powershell -NoProfile -ExecutionPolicy Bypass -File $PSMUX_CONF_DIR/scripts/move-pane.ps1 L"
bind-key -nr "Ñ" run-shell -b "powershell -NoProfile -ExecutionPolicy Bypass -File $PSMUX_CONF_DIR/scripts/move-pane.ps1 D"
bind-key -nr "Ò" run-shell -b "powershell -NoProfile -ExecutionPolicy Bypass -File $PSMUX_CONF_DIR/scripts/move-pane.ps1 U"
bind-key -nr "Ó" run-shell -b "powershell -NoProfile -ExecutionPolicy Bypass -File $PSMUX_CONF_DIR/scripts/move-pane.ps1 R"

# M-h/j/k/l: select pane, but pass the key through to (n)vim/ssh (replaces navi.tmux)
bind-key -n M-h if-shell -F "#{m/ri:^(g?(view|n?vim?x?)(diff)?|ssh)$,#{pane_current_command}}" "send-keys M-h" "select-pane -LZ"
bind-key -n M-j if-shell -F "#{m/ri:^(g?(view|n?vim?x?)(diff)?|ssh)$,#{pane_current_command}}" "send-keys M-j" "select-pane -DZ"
bind-key -n M-k if-shell -F "#{m/ri:^(g?(view|n?vim?x?)(diff)?|ssh)$,#{pane_current_command}}" "send-keys M-k" "select-pane -UZ"
bind-key -n M-l if-shell -F "#{m/ri:^(g?(view|n?vim?x?)(diff)?|ssh)$,#{pane_current_command}}" "send-keys M-l" "select-pane -RZ"

bind-key -r j select-pane -DZ
bind-key -r h select-pane -LZ
bind-key -r k select-pane -UZ
bind-key -r l select-pane -RZ

# C-M-[ / C-M-] / C-M-S-[ / C-M-S-]: resize
bind-key -n " " resize-pane -L 4
bind-key -n "¡" resize-pane -R 4
bind-key -n "¢" resize-pane -U 4
bind-key -n "£" resize-pane -D 4

bind-key a last-window
bind-key C-a last-window
bind-key -r "M-'" next-window
bind-key -r "M-;" previous-window

bind-key -n C-M-a last-window
bind-key -n "©" previous-window
bind-key -n "¨" next-window
bind-key -n "°" swap-window -dt +1
bind-key -n "±" swap-window -dt -1
bind-key -n M-A last-pane

bind-key V split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"

bind-key C-v split-window -h -l 20% -c "#{pane_current_path}"
bind-key C-s split-window -v -l 20% -c "#{pane_current_path}"

bind-key -T t_v v switch-client -T root \; split-window -h -c "#{pane_current_path}"
bind-key -T t_s s switch-client -T root \; split-window -v -c "#{pane_current_path}"

# C-M-Return: new window in current directory
bind-key -n "²" new-window -c "#{pane_current_path}"

# prefix 1..9 / C-M-1..9: select window N, creating it if missing
bind-key 1 if-shell -F "#{m/r:(^| )1( |$),#{W:#{window_index} }}" "select-window -t :1" "new-window -t :1 -c '#{pane_current_path}'"
bind-key 2 if-shell -F "#{m/r:(^| )2( |$),#{W:#{window_index} }}" "select-window -t :2" "new-window -t :2 -c '#{pane_current_path}'"
bind-key 3 if-shell -F "#{m/r:(^| )3( |$),#{W:#{window_index} }}" "select-window -t :3" "new-window -t :3 -c '#{pane_current_path}'"
bind-key 4 if-shell -F "#{m/r:(^| )4( |$),#{W:#{window_index} }}" "select-window -t :4" "new-window -t :4 -c '#{pane_current_path}'"
bind-key 5 if-shell -F "#{m/r:(^| )5( |$),#{W:#{window_index} }}" "select-window -t :5" "new-window -t :5 -c '#{pane_current_path}'"
bind-key 6 if-shell -F "#{m/r:(^| )6( |$),#{W:#{window_index} }}" "select-window -t :6" "new-window -t :6 -c '#{pane_current_path}'"
bind-key 7 if-shell -F "#{m/r:(^| )7( |$),#{W:#{window_index} }}" "select-window -t :7" "new-window -t :7 -c '#{pane_current_path}'"
bind-key 8 if-shell -F "#{m/r:(^| )8( |$),#{W:#{window_index} }}" "select-window -t :8" "new-window -t :8 -c '#{pane_current_path}'"
bind-key 9 if-shell -F "#{m/r:(^| )9( |$),#{W:#{window_index} }}" "select-window -t :9" "new-window -t :9 -c '#{pane_current_path}'"

bind-key -n "Á" if-shell -F "#{m/r:(^| )1( |$),#{W:#{window_index} }}" "select-window -t :1" "new-window -t :1 -c '#{pane_current_path}'"
bind-key -n "Â" if-shell -F "#{m/r:(^| )2( |$),#{W:#{window_index} }}" "select-window -t :2" "new-window -t :2 -c '#{pane_current_path}'"
bind-key -n "Ã" if-shell -F "#{m/r:(^| )3( |$),#{W:#{window_index} }}" "select-window -t :3" "new-window -t :3 -c '#{pane_current_path}'"
bind-key -n "Ä" if-shell -F "#{m/r:(^| )4( |$),#{W:#{window_index} }}" "select-window -t :4" "new-window -t :4 -c '#{pane_current_path}'"
bind-key -n "Å" if-shell -F "#{m/r:(^| )5( |$),#{W:#{window_index} }}" "select-window -t :5" "new-window -t :5 -c '#{pane_current_path}'"
bind-key -n "Æ" if-shell -F "#{m/r:(^| )6( |$),#{W:#{window_index} }}" "select-window -t :6" "new-window -t :6 -c '#{pane_current_path}'"
bind-key -n "Ç" if-shell -F "#{m/r:(^| )7( |$),#{W:#{window_index} }}" "select-window -t :7" "new-window -t :7 -c '#{pane_current_path}'"
bind-key -n "È" if-shell -F "#{m/r:(^| )8( |$),#{W:#{window_index} }}" "select-window -t :8" "new-window -t :8 -c '#{pane_current_path}'"
bind-key -n "É" if-shell -F "#{m/r:(^| )9( |$),#{W:#{window_index} }}" "select-window -t :9" "new-window -t :9 -c '#{pane_current_path}'"

# psmux's choose-window takes no template, so joining a pane asks for the window index
bind-key   @ command-prompt -p "join pane from window:" "join-pane -h -s ':%%'"
bind-key C-@ command-prompt -p "join pane from window:" "join-pane -s ':%%'"

bind-key -n M-~ command-prompt -p "join pane from window:" "join-pane -h -s ':%%'"
bind-key -n M-! if-shell -F "#{m/r:(^| )1( |$),#{W:#{window_index} }}" "join-pane -ht :1" "break-pane -t :1"
bind-key -n M-@ if-shell -F "#{m/r:(^| )2( |$),#{W:#{window_index} }}" "join-pane -ht :2" "break-pane -t :2"
bind-key -n M-# if-shell -F "#{m/r:(^| )3( |$),#{W:#{window_index} }}" "join-pane -ht :3" "break-pane -t :3"
bind-key -n M-$ if-shell -F "#{m/r:(^| )4( |$),#{W:#{window_index} }}" "join-pane -ht :4" "break-pane -t :4"
bind-key -n M-% if-shell -F "#{m/r:(^| )5( |$),#{W:#{window_index} }}" "join-pane -ht :5" "break-pane -t :5"
bind-key -n M-^ if-shell -F "#{m/r:(^| )6( |$),#{W:#{window_index} }}" "join-pane -ht :6" "break-pane -t :6"
bind-key -n M-& if-shell -F "#{m/r:(^| )7( |$),#{W:#{window_index} }}" "join-pane -ht :7" "break-pane -t :7"
bind-key -n M-* if-shell -F "#{m/r:(^| )8( |$),#{W:#{window_index} }}" "join-pane -ht :8" "break-pane -t :8"
bind-key -n M-( if-shell -F "#{m/r:(^| )9( |$),#{W:#{window_index} }}" "join-pane -ht :9" "break-pane -t :9"

bind-key x set-option -gF @tmux-cut-pane "#{pane_id}" \; display-message "Cut pane [#{@tmux-cut-pane}] #{pane_title}"
# psmux does not expand formats in -s and has no `run-shell -C`; run-shell expands them
bind-key p run-shell -b "tmux move-pane -s #{@tmux-cut-pane}" \; display-message "Paste pane [#{@tmux-cut-pane}] #{pane_title}"

bind-key X set-option -gF @tmux-cut-window "#{window_id}" \; display-message "Cut window [#{@tmux-cut-window}] #{window_name}"
bind-key P run-shell -b "tmux move-window -s #{@tmux-cut-window}" \; display-message "Paste window [#{@tmux-cut-window}] #{window_name}"

bind-key C-f resize-pane -Z

bind-key r command-prompt "rename-window '%%'"

bind-key Q confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key C-w confirm-before -p "kill-window #W? (y/n)" kill-window

bind-key R source-file ~/.psmux.conf \; display "Reloaded ~/.psmux.conf"

### Look & Feel
set-option -g pane-border-lines single

set-option -g pane-active-border-style "fg=color213"
set-option -g message-style 'bg=magenta,fg=white,bold'

# Window names equal to the shell (zsh on Linux, pwsh/powershell/cmd here) are hidden
set-option -g set-titles-string            '#{window_index}#{?#{m/r:^(zsh|pwsh|powershell|cmd|bash)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],}#{?#{>:#{session_windows},1},(#{window_index}/#{session_windows}),}'
set-option -g window-status-style          'fg=#9887c3,bold'
set-option -g window-status-last-style     'fg=#ded8eb,bold'
set-option -g window-status-format         ' #{window_index}#{?#{m/r:^(zsh|pwsh|powershell|cmd|bash)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],} '
set-option -g window-status-current-format ' #{window_index}#{?#{m/r:^(zsh|pwsh|powershell|cmd|bash)$,#{window_name}},,:#{window_name}}#{?#{>:#{window_panes},1},[+#{e|-:#{window_panes},1}],}#{?window_zoomed_flag,[Z],} '
set-option -g window-status-current-style  'bg=magenta,fg=white,bold'

set-option -g status-left-length 140
set-option -g status-right-length 140
set-option -g status-justify absolute-centre
set-option -g status-style 'bg=default'
# tmux-prefix-highlight equivalent: ❤ [key table] / c (copy) / s (sync) / idle ❤
set-option -g status-left '#{?#{||:#{client_prefix},#{m:t_*,#{client_key_table}}},#[fg=white bg=magenta bold]❤#{?#{m:t_*,#{client_key_table}}, #{s/t_//:client_key_table},},#{?pane_in_mode,#[fg=black bg=yellow bold]c,#{?synchronize-panes,#[fg=black bg=green]s,#[fg=white bg=#6D61A8 bold]❤}}}#[default]'
set-option -g status-right ''

